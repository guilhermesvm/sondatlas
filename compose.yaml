services:
  influxdb2:
    image: influxdb:2.9.1
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      INFLUXDB_URL: http://influxdb2:8086
    volumes:
      - ./data:/app/data
    depends_on:
      - influxdb2

volumes:
  influxdb2-data:
  influxdb2-config:
