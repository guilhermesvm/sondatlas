services:
  influxdb3-core:
    image: influxdb:3.11.5-core
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=ripe-atlas-node
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - influxdb3-data:/var/lib/influxdb3

volumes:
  influxdb3-data:
