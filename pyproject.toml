[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sondatlas"
version = "0.1.0"
description = "Educational kit to host a RIPE Atlas probe and follow its measurements"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<1",
    "influxdb-client>=1.50,<2",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "starlette>=1.7,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
