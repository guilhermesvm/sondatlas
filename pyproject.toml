[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ripe-atlas-tcc"
version = "0.1.0"
description = "Data ingestion pipeline for results from RIPE Atlas probe 1017210"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.50,<2",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
packages = []
